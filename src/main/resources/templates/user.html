<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>User Home Page</title>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Welcome, <span th:text="${user.firstName}">User</span>!</h1>
    <div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="margin-right: 15px;">
            Admin Panel
        </a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<h3>Your Profile Information</h3>
<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Roles</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:text="${user.id}">1</td>
        <td th:text="${user.firstName}">First</td>
        <td th:text="${user.lastName}">Last</td>
        <td th:text="${user.email}">user@mail.com</td>
        <td>
            <span th:each="role, iterStat : ${user.roles}"
                  th:text="${role.name} + (!${iterStat.last} ? ', ' : '')">
                ROLE_USER
            </span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
