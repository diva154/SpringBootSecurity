<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel - Users</title>
</head>
<body>

<div style="display: flex; justify-content: space-between;align-items: center;">
    <h2>All Users (Admin panel)</h2>
    <div>
        <a th:href="@{/user}" style="margin-right: 15px;">My Profile</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<p>
    <a th:href="@{/admin/new}">+ Add New User</a>
</p>

<table border="2" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Roles</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.firstName}">First</td>
        <td th:text="${user.lastName}">Last</td>
        <td th:text="${user.email}">email@mail.com</td>
        <td>
            <span th:each="role, iterStat : ${user.roles}"
                  th:text="${role.name} + (!${iterStat.last} ? ', ' : '')">
                ROLE_USER
            </span>
        </td>
        <td>
            <a th:href="@{/admin/edit/{id}(id=${user.id})}">Edit</a>
            |
            <form th:action="@{/admin/delete/{id}(id=${user.id})}"
                  method="post"
                  style="display: inline;"
                  onsubmit="return confirm('Are you sure you want to delete this user?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
