<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id == null} ? 'Add User' : 'Edit User'">User Form</title>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
<h2 th:text="${user.id == null} ? 'Add New User' : 'Edit User'">User Form</h2>
    <form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
    </form>
</div>

<form th:action="@{/admin/save}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <label>First Name:</label><br>
    <input type="text" th:field="*{firstName}" required>
    <div th:if="${#fields.hasErrors('firstName')}"
         th:errors="*{firstName}">
    </div>
    <br><br>

    <label>Last Name:</label><br>
    <input type="text" th:field="*{lastName}" required>
    <div th:if="${#fields.hasErrors('lastName')}"
         th:errors="*{lastName}">
    </div>
    <br><br>

    <label>Email:</label><br>
    <input type="email" th:field="*{email}" required/>
    <div th:if="${#fields.hasErrors('email')}"
         th:errors="*{email}">
    </div>
    <br><br>

    <label>Password:</label><br>
    <input type="password"
           name="password"
           th:required="${user.id == null}"
           th:placeholder="${user.id != null} ? 'Leave blank to keep current password' : 'Enter password'"/>
    <div th:if="${#fields.hasErrors('password')}"
         th:errors="*{password}">
    </div>
    <br><br>

    <label>Roles:</label><br>
    <div th:each="role : ${allRoles}">
        <label>
            <input type="checkbox"
                   name="roleIds"
                   th:value="${role.id}"
                   th:checked="${user.roles != null and user.roles.contains(role)}"/>
            <span th:text="${role.name}">ROLE_USER</span>
        </label>
    </div>
    <div th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}" style="color: red;"></div>
    <br>

    <button type="submit" style="display: inline-block; padding: 10px 20px;">
        Save
    </button>
    <a th:href="@{/admin}">Cancel</a>

</form>
</body>
</html>
